<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el número secreto</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="https://img.icons8.com/dusk/64/question-mark.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Adivina el número <br><span>entre 1 y 100</span></h1>
        <input type="text" class="input" id="numero-usuario" placeholder="Ingresa un número">
        <button id="adivinar-btn">Adivinar</button>
        <div class="mensaje" id="mensaje" style="color: blueviolet;"></div>
        <div id="lista-numeros"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
