<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el número secreto</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="https://img.icons8.com/dusk/64/question-mark.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"> <!-- Fuente pixelada -->
</head>
<body>
    <div class="container">
        <h1>Adivina el número entre 1 y 100</h1>
        <div class="group">
            <input type="text" id="numero-usuario" placeholder="Ingresa un número">
        </div>
        <button id="adivinar-btn">Adivinar</button>
        <div id="mensaje"></div>
        <div id="lista-numeros"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
